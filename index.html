<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Trafik Işığı Simülasyonu</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <h1>Trafik Işığı</h1>
          <p class="subtitle">Araç ekle — ışıklar otomatik döner</p>
        </div>
      </header>
      <main class="layout">
        <canvas id="scene"></canvas>
        <aside class="hud">
          <section>
            <h2>Araç ekle</h2>
            <div class="btn-grid" id="add-vehicle">
              <button type="button" data-dir="kuzey">Kuzey</button>
              <button type="button" data-dir="guney">Güney</button>
              <button type="button" data-dir="dogu">Doğu</button>
              <button type="button" data-dir="bati">Batı</button>
            </div>
          </section>
          <section>
            <h2>Durum</h2>
            <pre id="status">—</pre>
          </section>
          <section>
            <h2>Olaylar</h2>
            <ul id="events"></ul>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
